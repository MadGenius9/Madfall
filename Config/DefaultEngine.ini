[/Script/Engine.RendererSettings]
; Pillar: AAA fidelity. Lumen + VSM + Nanite are the baseline, not an option,
; because the lighting model for caves and interiors assumes GI.
r.DefaultFeature.AutoExposure=False
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.Nanite.ProjectEnabled=True
r.SkinCache.CompileShaders=True
; Hardware ray tracing for Lumen (Phase 6). Chunk meshes are procedural, so
; they have no mesh distance fields and software Lumen could not see them off
; screen: caves and interiors took sky light through walls and forest shade had
; no bounce. Ray traced, Lumen traces the chunk geometry itself (procedural
; meshes build ray tracing geometry, r.RayTracing.Geometry.ProceduralMeshes).
; GPUs without ray tracing fall back to software Lumen at startup. Shadows stay
; virtual shadow maps, which are already sharp and cheaper.
r.RayTracing=True
r.RayTracing.Shadows=False
r.Lumen.HardwareRayTracing=True
r.AllowStaticLighting=False
; Voxel chunks are procedurally generated and re-cooked at runtime; distance
; field updates must be able to keep up with edits (Phase 2).
r.DistanceFields.SupportEvenIfHardwareRayTracingSupported=True


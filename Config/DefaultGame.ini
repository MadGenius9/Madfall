[/Script/UnrealEd.ProjectPackagingSettings]
BuildConfiguration=PPBC_Development
UsePakFile=True
bUseIoStore=True
bShareMaterialShaderCode=True
; Definitions live next to Content, not in it, and are read with plain file IO.
; Staged loose (NonUFS) so shipped JSON stays inspectable. Path is relative to Content.
; Mods/ is NOT staged: Scripts/Package.ps1 installs each mod's build output, so a
; content mod's uncooked source plugin never ships.
+DirectoriesToAlwaysStageAsNonUFS=(Path="../Definitions")
; Materials are referenced by path from data (mad.mesh.SectionMaterial, surface
; definitions), which the cooker cannot see - without this the packaged game has
; no voxel material and every chunk draws with the engine's checker default.
+DirectoriesToAlwaysCook=(Path="/Game/Materials")
; The photo-textured surface instances and their textures, named by surface definitions.
+DirectoriesToAlwaysCook=(Path="/Game/Surfaces")
; Photo-scanned models model blocks name by render.mesh and render.material.
+DirectoriesToAlwaysCook=(Path="/Game/Models")
+DirectoriesToAlwaysCook=(Path="/Game/Characters")
; Model blocks name meshes by path too (render.mesh); the shipped barrel uses the
; engine's basic shapes, and BasicShapeMaterial tints meshes without a material.
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
